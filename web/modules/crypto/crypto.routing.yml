crypto.webhook:
  path: 'the-moon/{symbol}/{dollar_amount}/{trend}'
  defaults:
    _controller: '\Drupal\crypto\Controller\CryptoController::binanceConnect'
  requirements:
    _access: 'TRUE'
crypto.webhook2:
  path: 'test/{symbol}/{test_id}/{trend}'
  defaults:
    _controller: '\Drupal\crypto\Controller\CryptoTestController::binanceConnect'
  requirements:
    _access: 'TRUE'
crypto.webhook3:
  path: 'test2/{symbol}/{test_id}/{trend}'
  defaults:
    _controller: '\Drupal\crypto\Controller\CryptoTestController2::binanceConnect'
  requirements:
    _access: 'TRUE'
crypto.webhook4:
  path: 'test2/{symbol}/{test_id}/{trend}/exit'
  defaults:
    _controller: '\Drupal\crypto\Controller\CryptoTestController2::exitTrade'
  requirements:
    _access: 'TRUE'